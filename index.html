<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডকুমেন্ট ক্রিয়েটর ও পিডিএফ মেকার</title>
    <meta name="description" content="অনলাইনে সহজে বাংলা বা ইংরেজি ডকুমেন্ট তৈরি করুন এবং কাস্টমাইজ করে পিডিএফ (PDF) ডাউনলোড করুন। সম্পূর্ণ ফ্রি এবং দ্রুত।">
    <meta name="keywords" content="PDF Maker, Document Creator, Bangla PDF, অনলাইন পিডিএফ মেকার, ডকুমেন্ট তৈরি">
    <meta name="author" content="Masum">
    <meta property="og:title" content="ডকুমেন্ট ক্রিয়েটর ও পিডিএফ মেকার">
    <meta property="og:description" content="অনলাইনে সহজে ডকুমেন্ট তৈরি করুন এবং পিডিএফ ডাউনলোড করুন।">
    <meta property="og:type" content="website">
    
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #2c3e50; }
        
        #editor-container {
            height: 300px;
            margin-bottom: 20px;
            background: white;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: #eef2f5;
            border-radius: 8px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 120px;
        }
        .control-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }
        .control-group select, .control-group input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: inherit;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #218838; }
        
        #pdf-content {
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📄 ডকুমেন্ট ক্রিয়েটর</h2>
        
        <div id="editor-container"></div>

        <div class="controls">
            <div class="control-group">
                <label>পেজ সাইজ</label>
                <select id="page-size">
                    <option value="a4">A4</option>
                    <option value="a5">A5</option>
                    <option value="letter">Letter</option>
                </select>
            </div>
            <div class="control-group">
                <label>মার্জিন (mm)</label>
                <input type="number" id="margin" value="10" min="0" max="50">
            </div>
            <div class="control-group">
                <label>ফন্ট সাইজ</label>
                <select id="font-size">
                    <option value="12px">ছোট</option>
                    <option value="16px" selected>মাঝারি</option>
                    <option value="20px">বড়</option>
                </select>
            </div>
        </div>

        <button onclick="downloadPDF()">📥 PDF ডাউনলোড করুন</button>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        var quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: 'এখানে আপনার ডকুমেন্ট লিখুন...',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['clean']
                ]
            }
        });

        function downloadPDF() {
            const pageSize = document.getElementById('page-size').value;
            const marginVal = document.getElementById('margin').value;
            const fontSize = document.getElementById('font-size').value;

            const element = document.createElement('div');
            element.id = 'pdf-content';
            element.innerHTML = quill.root.innerHTML;
            element.style.fontSize = fontSize;
            element.style.fontFamily = "'Hind Siliguri', sans-serif";

            const opt = {
                margin:       parseInt(marginVal),
                filename:     'my-document.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: pageSize, orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }
    </script>

</body>
</html>
