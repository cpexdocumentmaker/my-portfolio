<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<style>
:root{--acc:#0f6b5c;--bg:#f3f5f8;--card:#fff;--ink:#1f2430;--mut:#667085;--line:#e2e6ec;--side:#fff;--hov:#f1f4f7;--tint:color-mix(in srgb,var(--acc) 12%,transparent);--accd:color-mix(in srgb,var(--acc) 82%,#000)}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans Bengali',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;height:100%}
#side{width:250px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;transition:transform .2s;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px;font-weight:700;font-size:17px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:17px}
#nav{flex:1;overflow:auto;padding:0 10px 14px}
.gt{font-size:11.5px;color:var(--mut);font-weight:600;margin:14px 10px 5px;letter-spacing:.3px}
.ni{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left;color:var(--ink)}
.ni:hover{background:var(--hov)}
.ni.on{background:var(--tint);color:var(--acc);font-weight:600}
svg.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--side);border-bottom:1px solid var(--line)}
.ib{border:1px solid var(--line);background:var(--card);border-radius:9px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.ib:hover{background:var(--hov)}
#burger{display:none}
.sr{flex:1;max-width:420px;position:relative}
.sr svg{position:absolute;left:11px;top:10px;color:var(--mut)}
.sr input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 12px 9px 38px}
#view{flex:1;overflow:auto;padding:22px;min-height:0}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.st b{font-size:26px;display:block}.st span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:24px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;cursor:pointer;display:block;width:100%}
.tc:hover{border-color:var(--acc);transform:translateY(-2px)}
.tc .ci{width:40px;height:40px;border-radius:10px;background:var(--tint);color:var(--acc);display:grid;place-items:center;margin-bottom:10px}
.tc b{display:block}.tc small{color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
h2{font-size:16px;margin:0 0 10px}
table.l{width:100%;border-collapse:collapse}
table.l td,table.l th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;font-size:14px}
.btn:hover{background:var(--hov)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.p:hover{background:var(--accd)}
.btn:disabled{opacity:.6;cursor:wait}
.tw{display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:18px;height:100%}
.fp{overflow:auto;min-height:0}
.pv{overflow:auto;min-height:0}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.f{margin-bottom:10px}
.f label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px}
.f input,.f select,.f textarea,.it input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px}
.f textarea{min-height:76px;resize:vertical}
.sc{overflow-x:auto}
.it{width:100%;border-collapse:collapse;margin-bottom:8px}
.it td{padding:2px}.it th{font-size:12px;color:var(--mut);text-align:left;padding:3px}
.x{border:0;background:none;color:#d92d20;cursor:pointer;font-size:18px}
#wrap{margin:0 auto;position:relative}
.paper{width:794px;min-height:1120px;background:#fff;color:#111;padding:46px 52px;font-size:13.5px;line-height:1.6;box-shadow:0 2px 14px rgba(20,30,50,.18);position:absolute;left:0;top:0;transform-origin:top left}
.pdf .paper{position:static;box-shadow:none}
.dh{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--acc);padding-bottom:12px;margin-bottom:18px}
.cn{font-size:20px;font-weight:700;color:var(--acc)}.ca{color:#555;font-size:12px}
.dt{font-size:24px;font-weight:700;letter-spacing:1px;color:#222;text-align:right}
.mt td{padding:1px 8px 1px 0}.pt{margin:14px 0}.pt small{display:block;color:#777}
.dtb{width:100%;border-collapse:collapse;margin:14px 0}
.dtb th{background:var(--acc);color:#fff;padding:7px;text-align:left;font-size:12.5px}
.dtb td{padding:7px;border-bottom:1px solid #ddd}
.dtb .r{text-align:right}
.tt{margin-left:auto;min-width:270px;border-collapse:collapse}.tt td{padding:4px 8px;text-align:right}.tt td:first-child{text-align:left}
.tt .g td{font-weight:700;font-size:15px;border-top:2px solid #222}
.sg{display:flex;justify-content:space-between;margin-top:70px}.sg div{border-top:1px solid #222;padding-top:5px;min-width:170px;text-align:center}
.ctr{text-align:center}
.cert{border:8px double var(--acc);padding:50px 30px;text-align:center;min-height:900px}
.cert h1{font-size:40px;color:var(--acc);letter-spacing:3px}.cert .nm{font-size:34px;font-weight:700;margin:18px 0;border-bottom:1px solid #999;display:inline-block;padding:0 30px}
.sec{font-weight:700;color:var(--acc);border-bottom:1px solid #ddd;margin:16px 0 6px;text-transform:uppercase;font-size:13px}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.fr{flex:1;width:100%;border:0;background:#fff;min-height:0}
.fv{display:flex;flex-direction:column;height:100%}
.fb{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--side);border-bottom:1px solid var(--line)}
a.ni,a.tc,a.pf{text-decoration:none;color:inherit}
.ni .ex{margin-left:auto;opacity:.5;width:15px;height:15px}
.sf{border-top:1px solid var(--line);padding:12px 14px}
.pf{display:flex;gap:10px;align-items:center;margin-bottom:10px}.pf b{display:block;font-size:14px}.pf small{color:var(--mut)}
.srow{display:flex;gap:6px;flex-wrap:wrap}
.so{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--mut)}.so:hover{color:var(--acc);border-color:var(--acc)}
.av{position:relative;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;overflow:hidden;flex-shrink:0;font-weight:700}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.qw{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:18px;align-items:start}
.f input[type=color]{height:40px;padding:3px;cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qp{text-align:center;position:sticky;top:0}
.qp canvas{width:min(100%,360px);height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
@media(max-width:900px){.qw{grid-template-columns:1fr}.qp{position:static}}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
#scrim{display:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#toast.show{opacity:1}
.tabs{display:none}
@media(max-width:900px){
 #side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}
 #side.open{transform:none}
 #scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
 #burger{display:grid}
 #view{padding:14px}
 .tw{grid-template-columns:1fr;height:auto}
 .tw[data-v=f] .pv,.tw[data-v=p] .fp{display:none}
 .tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}
}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}.app,.main{display:block;height:auto}
 #side,.bar,.fp,.tb,.tabs,#toast{display:none!important}
 #view{padding:0;overflow:visible}.tw{display:block}.pv{overflow:visible}
 #wrap{width:auto!important;height:auto!important}.paper{position:static;transform:none!important;box-shadow:none}
}
</style>
</head>

 return '<h1>সেটিং</h1><p class="sub">এখানের তথ্য সব ডকুমেন্টের হেডারে বসবে।</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="panel"><h2>ব্র্যান্ড ও কোম্পানি</h2>'+f('name','সাইটের নাম')+f('owner','আপনার নাম')+f('photo','ছবির লিংক (URL)')+f('co','কোম্পানির নাম')+'<div class="f"><label>ঠিকানা</label><textarea data-s="addr">'+esc(s.addr)+'</textarea></div>'+f('phone','ফোন')+f('email','ইমেইল','email')+f('cur','মুদ্রা চিহ্ন (RM, ৳, $)')+'</div><div class="panel"><h2>চেহারা</h2><div class="f"><label>মূল রঙ</label><div class="sw">'+sw+'<input type="color" data-s="acc" value="'+esc(s.acc)+'" aria-label="নিজের রঙ" style="width:36px;height:30px;padding:0;border:0"></div></div><label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="dk"'+(s.dark?' checked':'')+'> ডার্ক মোড</label><h2 style="margin-top:24px">ডেটা ব্যাকআপ</h2><p class="sub" style="margin-bottom:10px">সব ডেটা শুধু এই ব্রাউজারে থাকে। নিয়মিত ব্যাকআপ রাখুন।</p><div class="tb"><button class="btn" data-act="exp">'+ico('dl')+' ব্যাকআপ নিন</button><label class="btn" style="cursor:pointer">'+ico('open')+' রিস্টোর<input type="file" id="imp" accept=".json" hidden></label><button class="btn" data-act="wipe" style="color:#d92d20">'+ico('trash')+' সব মুছুন</button></div></div>'+soP+'</div>';
}

/* ---------- রাউটার ---------- */
function go(id,push){
 var m=MODS.filter(function(x){return x.id===id})[0]||MODS[0];route=m.id;cur=null;
 var v=$('view');
 if(m.tool)v.innerHTML=vTool(m.tool);
 else if(m.frame)v.innerHTML='<div class="fv"><div class="fb"><b>'+m.n+'</b><span style="flex:1"></span><a class="btn" href="'+m.frame+'" target="_blank" rel="noopener">নতুন ট্যাবে খুলুন '+ico('open')+'</a></div><iframe class="fr" src="'+m.frame+'" title="'+m.n+'"></iframe></div>';
 else if(m.id==='img')v.innerHTML=vImg();
 else if(m.id==='qr'){v.innerHTML=vQr();qrDraw()}
 else if(m.id==='settings')v.innerHTML=vSet();
 else v.innerHTML=vHome();
 if(m.tool)draw();
 v.style.padding=m.frame?'0':'';
 if(push!==false&&location.hash!=='#/'+m.id)history.pushState(null,'','#/'+m.id);
 buildNav($('q').value);$('side').classList.remove('open');$('scrim').classList.remove('on');v.scrollTop=0;
}

/* ---------- ইভেন্ট ---------- */
document.addEventListener('click',function(e){
 var b=e.target.closest('button,label');if(!b)return;var d=b.dataset;
 if(d.go){go(d.go);return}
 if(d.tab){var tw=document.querySelector('.tw');tw.dataset.v=d.tab;document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('p',x===b)});setTimeout(fit,0);return}
 if(d.open){var x=D.docs.filter(function(z){return z.id==d.open})[0];if(x){D.drafts[x.t]=JSON.parse(JSON.stringify(x.d));save();go(x.t)}return}
 if(d.deld){D.docs=D.docs.filter(function(z){return z.id!=d.deld});save();go('home');return}
 if(d.acc){D.set.acc=d.acc;save();applySet();return}
 if(d.addi){cur.d.items.push({});$('fi').innerHTML=itemsH(cur.t,cur.d);D.drafts[cur.t.id]=cur.d;save();draw();return}
 if(d.deli!==undefined){cur.d.items.splice(+d.deli,1);if(!cur.d.items.length)cur.d.items.push({});$('fi').innerHTML=itemsH(cur.t,cur.d);D.drafts[cur.t.id]=cur.d;save();draw();return}
 if(d.delimg!==undefined){IMGS.splice(+d.delimg,1);imList();return}
 var a=d.act;if(!a)return;
 if(a==='pdf'){var f=cur.d.f;pdfOf(paper(cur.t,cur.d),794,safe(cur.t.n+'-'+docTitle())+'.pdf','portrait',b)}
 else if(a==='print')window.print();
 else if(a==='save'){D.docs.push({id:Date.now(),t:cur.t.id,ti:docTitle(),d:JSON.parse(JSON.stringify(cur.d)),ts:new Date().toISOString()});save();toast('সংরক্ষিত হয়েছে। ড্যাশবোর্ডে দেখতে পাবেন।')}
 else if(a==='reset'){if(!confirm('ফর্ম খালি করে নতুন করবেন?'))return;delete D.drafts[cur.t.id];save();go(cur.t.id)}
 else if(a==='imgpdf'){
  if(!IMGS.length){toast('আগে ছবি বাছাই করুন।');return}
  var o=$('imo').value,w=o==='landscape'?1123:794,hh=o==='landscape'?794:1123;
  pdfOf(IMGS.map(function(s,i){return '<div style="width:'+w+'px;height:'+(hh-2)+'px;display:flex;align-items:center;justify-content:center;background:#fff;'+(i<IMGS.length-1?'page-break-after:always':'')+'"><img src="'+s+'" style="max-width:96%;max-height:96%;object-fit:contain"></div>'}).join(''),w,'images.pdf',o,b)}
 else if(a==='qpre'){var PR={classic:{dot:'sq',eye:'sq',grad:false,fg:'#000000'},round:{dot:'rd',eye:'rd',grad:false,fg:'#000000'},dots:{dot:'ci',eye:'ci',grad:false,fg:'#000000',ec:'H'},grad:{dot:'rd',eye:'rd',grad:true,fg:'#0f6b5c',fg2:'#2563eb'},brand:{dot:'rd',eye:'rd',grad:false,fg:D.set.acc}};Object.assign(Q,PR[d.pre]);qSave();$('view').innerHTML=vQr();qrDraw()}
 else if(a==='qme'){var mi=new Image();mi.crossOrigin='anonymous';mi.onload=function(){Q.logo=mi;qrDraw()};mi.onerror=function(){toast('আপনার ছবি লোড হয়নি। ইন্টারনেট দেখুন বা সেটিংসে ছবির লিংক ঠিক করুন।')};mi.src=D.set.photo}
 else if(a==='qlogox'){Q.logo=null;var lf=$('qlogo');if(lf)lf.value='';qrDraw()}
 else if(a==='qpng'||a==='qsvg'||a==='qpdf'){
  var qo=null;try{qo=qObj()}catch(e){}
  if(!qo){toast('আগে QR-এর তথ্য দিন।');return}
  if(a==='qpng')qDl($('qrc').toDataURL('image/png'),'qr-'+Q.type+'.png');
  else if(a==='qsvg'){try{var u=URL.createObjectURL(new Blob([qSvg(qo)],{type:'image/svg+xml'}));qDl(u,'qr-'+Q.type+'.svg');setTimeout(function(){URL.revokeObjectURL(u)},1000)}catch(e){toast('SVG বানানো যায়নি।')}}
  else{var tt=QT[Q.type].hide?'':qText();tt=tt.length>140?tt.slice(0,140)+'…':tt;
   pdfOf('<div style="width:794px;height:1120px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;color:#111;text-align:center;padding:60px;box-sizing:border-box"><div style="font-size:30px;font-weight:700;margin-bottom:30px">'+esc(Q.cap||QT[Q.type].n)+'</div><img src="'+$('qrc').toDataURL('image/png')+'" style="width:520px;height:'+Math.round(520*$('qrc').height/$('qrc').width)+'px"><div style="margin-top:26px;font-size:15px;color:#555;word-break:break-all;max-width:620px">'+esc(tt)+'</div><div style="margin-top:40px;font-size:13px;color:#888">'+esc(D.set.co)+'</div></div>',794,'QR-'+Q.type+'.pdf','portrait',b)}}
 else if(a==='exp'){var bl=new Blob([JSON.stringify(D)],{type:'application/json'}),u=document.createElement('a');u.href=URL.createObjectURL(bl);u.download='doc-studio-backup.json';u.click();setTimeout(function(){URL.revokeObjectURL(u.href)},1000)}
 else if(a==='wipe'){if(confirm('সব সংরক্ষিত ডকুমেন্ট, খসড়া ও সেটিং মুছে যাবে। নিশ্চিত?')){D={set:defSet(),docs:[],drafts:{}};save();applySet();go('home')}}
});
document.addEventListener('input',function(e){
 var t=e.target,d=t.dataset;
 if(d.k!==undefined&&cur){cur.d.f[d.k]=t.value}
 else if(d.i!==undefined&&cur){cur.d.items[+d.i][d.c]=t.value}
 else if(d.s!==undefined){D.set[d.s]=t.value;if(d.s==='acc'||d.s==='name'||d.s==='photo'||d.s==='owner')applySet()}
 else if(d.so!==undefined){D.set.soc[d.so]=t.value.trim().replace(/^@/,'');renderFoot()}
 else if(d.q!==undefined){Q.v[d.q]=t.value;qSave();qrDraw();return}
 else if(d.qo!==undefined){Q[d.qo]=(d.qo==='size'||d.qo==='margin'||d.qo==='lsize')?num(t.value):(d.qo==='grad'?t.checked:t.value);qSave();qrDraw();return}
 else return;
 if(cur){D.drafts[cur.t.id]=cur.d;draw()}save();
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.id==='dk'){D.set.dark=t.checked?1:0;save();applySet()}
 else if(t.id==='qt'){Q.type=t.value;$('qf').innerHTML=QT[Q.type].F.map(qField).join('');qSave();qrDraw()}
 else if(t.id==='qlogo'&&t.files[0]){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){Q.logo=im;qrDraw()};im.src=fr.result};fr.readAsDataURL(t.files[0])}
 else if(t.id==='imf'){addImgs(Array.prototype.slice.call(t.files),0);t.value=''}
 else if(t.id==='imp'&&t.files[0]){var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j.set)throw 0;D=j;D.docs=D.docs||[];D.drafts=D.drafts||{};D.set=Object.assign(defSet(),D.set);D.set.soc=Object.assign(defSet().soc,D.set.soc||{});save();applySet();go('home');toast('রিস্টোর হয়েছে।')}catch(x){toast('ফাইলটি সঠিক ব্যাকআপ নয়।')}};r.readAsText(t.files[0])}
});
$('q').addEventListener('input',function(){buildNav(this.value)});
$('q').addEventListener('keydown',function(e){if(e.key==='Enter'){var m=MODS.filter(function(x){return x.n.toLowerCase().indexOf($('q').value.toLowerCase())>=0})[0];if(m){$('q').value='';go(m.id)}}});
$('burger').addEventListener('click',function(){$('side').classList.add('open');$('scrim').classList.add('on')});
$('scrim').addEventListener('click',function(){$('side').classList.remove('open');this.classList.remove('on')});
$('theme').addEventListener('click',function(){D.set.dark=D.set.dark?0:1;save();applySet()});
$('gear').addEventListener('click',function(){go('settings')});
window.addEventListener('popstate',function(){go(location.hash.replace('#/','')||'home',false)});
window.addEventListener('resize',fit);
$('burger').innerHTML=ico('menu');$('si').innerHTML=ico('search');$('theme').innerHTML=ico('moon');$('gear').innerHTML=ico('set');
var r0=location.hash.replace('#/','');history.replaceState(null,'','#/home');
applySet();go(r0||'home');
})();
</script>
